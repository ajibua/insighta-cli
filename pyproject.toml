[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insighta-cli"
version = "1.0.0"
description = "Insighta Labs+ CLI — demographic intelligence from the command line"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.scripts]
insighta = "insighta_cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
